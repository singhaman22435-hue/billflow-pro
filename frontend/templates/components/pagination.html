{% macro render_pagination(pagination, endpoint) %}
<div class="pagination" style="display:flex; justify-content:center; align-items:center; gap:8px; margin-top:20px;">
  {% if pagination.has_prev %}
    <a href="{{ url_for(endpoint, page=pagination.prev_num, **request.args) }}" class="btn btn-sm btn-secondary">← Prev</a>
  {% else %}
    <button class="btn btn-sm btn-secondary" disabled>← Prev</button>
  {% endif %}

  <span style="font-size:0.9rem; color:var(--text-muted); font-weight:500;">
    Page {{ pagination.page }} of {{ pagination.pages }}
  </span>

  {% if pagination.has_next %}
    <a href="{{ url_for(endpoint, page=pagination.next_num, **request.args) }}" class="btn btn-sm btn-secondary">Next →</a>
  {% else %}
    <button class="btn btn-sm btn-secondary" disabled>Next →</button>
  {% endif %}
</div>
{% endmacro %}
