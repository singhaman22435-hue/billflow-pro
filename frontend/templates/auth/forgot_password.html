<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — BillFlow Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body { font-family: 'Inter', sans-serif; background: var(--bg-primary); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .auth-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 40px; width: 100%; max-width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .auth-logo { text-align: center; margin-bottom: 28px; }
    .auth-icon { font-size: 3rem; margin-bottom: 10px; }
    .auth-title { font-size: 1.5rem; font-weight: 800; color: var(--text-primary); }
    .auth-sub { color: var(--text-muted); font-size: 0.88rem; margin-top: 6px; }
  </style>
</head>
<body>
<div class="auth-card">
  <div class="auth-logo">
    <div class="auth-icon">🔐</div>
    <div class="auth-title">Forgot Password?</div>
    <div class="auth-sub">Enter your email and we'll send you a reset link</div>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, msg in messages %}
    <div class="alert alert-{{ category }}" style="margin-bottom:16px;padding:12px;border-radius:8px;{% if category=='danger' %}background:rgba(220,38,38,0.1);border:1px solid rgba(220,38,38,0.3);color:#ef4444;{% elif category=='success' %}background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.3);color:#10b981;{% else %}background:rgba(99,102,241,0.1);border:1px solid rgba(99,102,241,0.3);color:#6366f1;{% endif %}">
      {{ msg }}
    </div>
    {% endfor %}
  {% endwith %}

  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group" style="margin-bottom:20px;">
      <label class="form-label">Email Address</label>
      <input type="email" name="email" class="form-control" placeholder="your@email.com" required autofocus>
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%;padding:14px;font-size:1rem;font-weight:600;">
      📧 Send Reset Link
    </button>
  </form>

  <div style="text-align:center;margin-top:20px;font-size:0.85rem;color:var(--text-muted);">
    Remembered it? <a href="{{ url_for('auth.login') }}" style="color:var(--accent);">Back to Login</a>
  </div>
</div>
</body>
</html>
